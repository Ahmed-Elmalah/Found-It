
name: found_it
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  go_router: ^18.1.4
  flutter_screenutil: ^5.9.3
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  flutter_dotenv: ^6.0.1
  image_picker: ^1.1.2
  flutter_animate: ^4.5.2
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  # Pinned: 23.x requires compileSdk 37, Flutter 3.47 targets 36.
  flutter_local_notifications: 22.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Supabase URL + publishable key. Not in git: copy .env.example to .env
    - .env
